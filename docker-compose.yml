services:
  pihole-sync:
    image: yourdockerhubuser/pihole-sync:latest
    container_name: pihole-sync
    restart: unless-stopped
    ports:
      - "8080:8080"          # dashboard
    environment:
      PIHOLE_PRIMARY_PASSWORD: "change-me"
      PIHOLE_REPLICA_PASSWORD: "change-me"
      TZ: "America/New_York"
    volumes:
      - ./config.yaml:/config/config.yaml:ro
      - ./data:/data
    # If the primary pihole runs on THIS host, join its network so you can
    # address it by container name (primary.host: http://pihole:80):
    # networks: [pihole_net]
# networks:
#   pihole_net:
#     external: true
#     name: pihole_default    # `docker network ls` to find it
