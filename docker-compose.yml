services:
  pihole-sync:
    build:
      context: .
    image: pihole-sync:local
    container_name: pihole-sync
    restart: unless-stopped
    env_file:
      - path: .env
        format: raw
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./config.yaml:/config/config.yaml:ro
      - ./data:/data
